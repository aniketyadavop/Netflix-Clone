<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <!-- <link rel="stylesheet" href="style"> -->
     <style>
    *{
        margin:0;
        padding:0;
    }
    .bg{
        background-image:url("background.jpg");
        height: 100vh;
        opacity: 50;
    }
    body{
        height: 500vh;
        background-color: black;
    }
    .black{
        background-color: black;
        width: 100%;
        height: 100vh;
        opacity: 70%;
    }
    nav img{
        width: 150px;;
        opacity:100%;
    }
    nav{
        display: flex;
        justify-content:space-between;
        margin: 200px;
        align-items: center;
        
    }
    
     </style>
</head>
<body>
    <div class="bg">
        <div class="black">
            <nav>
                <div class="img">
                    <img src="netflix-logo-0.webp" alt="Netflix-Logo">
                    </div>
                    <div class="right">
                    <label for="Language">
                        <select name="Language" id="Language">
                            <option value="Hindi">Hindi</option>
                            <option value="English">English</option>
                        </select>
                    </label>
                    <button>Sign In</button>
                </div>
            </nav>
        </div>
    </div>
</body>
</html>
